# Merged on top of Harbor's base compose file. `main` is the agent container.
services:
  main:
    depends_on:
      sim:
        condition: service_healthy

  sim:
    build:
      context: ./sim
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

schema_version = "1.3"

artifacts = [
    { source = "/data/episode.jsonl", service = "sim" },
]

[task]
name = "battleship/bs5-s121"
description = "Play Battleship on a small board against a coded opponent that eliminates fleets exactly."
keywords = ["game", "hidden-information", "search", "mcp"]

[metadata]
category = "game"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096

[agent]
timeout_sec = 1500.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 3072
storage_mb = 4096

[[environment.mcp_servers]]
name = "battleship"
transport = "streamable-http"
url = "http://sim:8000/mcp"

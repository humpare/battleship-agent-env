schema_version = "1.3"

artifacts = [
    { source = "/data/episode.jsonl", service = "sim" },
]

[task]
name = "flatland-dispatch/f-sustained-s102"
description = "Dispatch trains on a single-track railway with passing loops (f-sustained)."
keywords = ["dispatching", "planning", "flatland", "mcp"]

[metadata]
category = "planning"
stage = "f-sustained"
split = "heldout"
trains = 16
horizon_ticks = 925

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

[[environment.mcp_servers]]
name = "dispatch"
transport = "streamable-http"
url = "http://sim:8000/mcp"

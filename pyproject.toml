[project]
name = "flatland-dispatch"
version = "0.1.0"
description = "Railway dispatching benchmark on Flatland, served over MCP as Harbor tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flatland-rl==4.3.0",
    "mcp==2.3.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "harbor==0.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch", "src/battleship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]
